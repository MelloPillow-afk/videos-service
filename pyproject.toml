[project]
name = "videos-service"
version = "0.1.0"
description = "Python API for the Pilgrims videos domain"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "uvicorn>=0.34,<1",
  "yoyo-migrations>=9,<10",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "openapi-spec-validator==0.9.0",
  "openapi-schema-validator>=0.8,<1",
  "PyYAML>=6,<7",
  "referencing>=0.36,<1",
  "pyright>=1.1,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "yamllint>=1.37,<2",
]
generated-runtime = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
]
service-runtime = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests/unit", "tests/integration"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: requires a running PostgreSQL test database"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.uv]
default-groups = ["dev", "generated-runtime", "service-runtime"]
