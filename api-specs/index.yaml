openapi: 3.2.0
info:
  title: Pilgrims Videos Service API
  version: 1.0.0
  description: |
    Manage videos, upload media, publish videos, and find playback links.
    All changes require admin access; viewers see ready, published videos.
    Viewer access may require authentication, depending on the service settings.
    JSON fields use snake_case. IDs are UUIDs and timestamps use UTC.
    Unavailable values are null. Previously shared playback links may remain
    accessible for a time after a video is unpublished or deleted.
servers:
  - url: /v1
    description: Version 1 of the API.
security:
  - bearer_auth: []
tags:
  - name: Videos
    description: Create, update, publish, and delete videos.
  - name: Uploads
    description: Upload video files and confirm completed uploads.
  - name: Playback
    description: Get video playback links.
  - name: Thumbnails
    description: Upload custom thumbnails or use generated thumbnails.
x-unresolved-decisions:
  - Identity provider, admin role mapping, and whether viewer reads require authentication.
  - Maximum source upload bytes, effective size enforcement, and confirmed-source finalization.
  - Approved thumbnail formats, dimensions, aspect ratio, byte limit, and cropping policy.
  - State retention following a rejected source confirmation.
  - Active thumbnail representation after removing custom when generation has failed.
paths:
  /videos:
    $ref: paths/videos.yaml#/~1videos
  /videos/{id}:
    $ref: paths/videos.yaml#/~1videos~1{id}
  /videos/{id}/upload-url:
    $ref: paths/videos.yaml#/~1videos~1{id}~1upload-url
  /videos/{id}/complete-upload:
    $ref: paths/videos.yaml#/~1videos~1{id}~1complete-upload
  /videos/{id}/playback:
    $ref: paths/videos.yaml#/~1videos~1{id}~1playback
  /videos/{id}/retry:
    $ref: paths/videos.yaml#/~1videos~1{id}~1retry
  /videos/{id}/thumbnail/upload-url:
    $ref: paths/thumbnails.yaml#/~1videos~1{id}~1thumbnail~1upload-url
  /videos/{id}/thumbnail/complete-upload:
    $ref: paths/thumbnails.yaml#/~1videos~1{id}~1thumbnail~1complete-upload
  /videos/{id}/thumbnail:
    $ref: paths/thumbnails.yaml#/~1videos~1{id}~1thumbnail
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Bearer token for authentication. Managing videos requires administrator access.
  parameters:
    id:
      $ref: parameters/id.yaml
    limit:
      $ref: parameters/limit.yaml
    cursor:
      $ref: parameters/cursor.yaml
    status:
      $ref: parameters/status.yaml
    publication_status:
      $ref: parameters/publication_status.yaml
    search:
      $ref: parameters/search.yaml
  requestBodies:
    upload_completion:
      required: true
      description: The upload ID returned with the upload URL.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/upload_complete'
          examples:
            source_attempt:
              value:
                upload_id: 04d1790f-f941-4ba6-8d97-0e6830ca4394
            thumbnail_attempt:
              value:
                upload_id: 50fd0382-794f-4c9b-9a12-60e92a89e008
  schemas:
    status:
      $ref: schemas/videos/status.yaml
    publication_status:
      $ref: schemas/videos/publication_status.yaml
    thumbnail_status:
      $ref: schemas/thumbnails/thumbnail_status.yaml
    thumbnail_source:
      $ref: schemas/thumbnails/thumbnail_source.yaml
    title:
      $ref: schemas/videos/title.yaml
    description:
      $ref: schemas/videos/description.yaml
    timestamp:
      $ref: schemas/shared/timestamp.yaml
    delivery_url:
      $ref: schemas/shared/delivery_url.yaml
    thumbnail_image:
      $ref: schemas/thumbnails/thumbnail_image.yaml
    video:
      $ref: schemas/videos/video.yaml
    video_create:
      $ref: schemas/videos/video_create.yaml
    video_update:
      $ref: schemas/videos/video_update.yaml
    source_upload_create:
      $ref: schemas/uploads/source_upload_create.yaml
    thumbnail_upload_create:
      $ref: schemas/thumbnails/thumbnail_upload_create.yaml
    upload_complete:
      $ref: schemas/uploads/upload_complete.yaml
    upload:
      $ref: schemas/uploads/upload.yaml
    source_upload:
      $ref: schemas/uploads/source_upload.yaml
    thumbnail_upload:
      $ref: schemas/thumbnails/thumbnail_upload.yaml
    source_upload_processing:
      $ref: schemas/uploads/source_upload_processing.yaml
    video_retry:
      $ref: schemas/videos/video_retry.yaml
    video_deletion:
      $ref: schemas/videos/video_deletion.yaml
    playback:
      $ref: schemas/playback/playback.yaml
    thumbnail:
      $ref: schemas/thumbnails/thumbnail.yaml
    videos:
      $ref: schemas/videos/videos.yaml
    error:
      type: object
      required:
        - error
      description: An error code and a readable explanation.
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Code identifying the error.
            message:
              type: string
              description: Readable explanation of the error.
      examples:
        - error:
            code: INVALID_VIDEO_ID
            message: The video ID must be a valid UUID.
  responses:
    video_resource:
      $ref: responses/video_resource.yaml
    bad_request:
      $ref: responses/bad_request.yaml
    unauthorized:
      $ref: responses/unauthorized.yaml
    forbidden:
      $ref: responses/forbidden.yaml
    video_not_found:
      $ref: responses/video_not_found.yaml
    conflict:
      $ref: responses/conflict.yaml
    file_too_large:
      $ref: responses/file_too_large.yaml
    too_many_requests:
      $ref: responses/too_many_requests.yaml
    internal_error:
      $ref: responses/internal_error.yaml
    unavailable:
      $ref: responses/unavailable.yaml
