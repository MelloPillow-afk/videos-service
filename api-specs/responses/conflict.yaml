description: The request conflicts with the current video or upload state.
content:
  application/json:
    schema:
      $ref: ../index.yaml#/components/schemas/error
    examples:
      invalid_state:
        value:
          error:
            code: INVALID_STATUS_TRANSITION
            message: The video is not eligible for this operation.
      stale_attempt:
        value:
          error:
            code: STALE_UPLOAD_ATTEMPT
            message: This upload attempt is no longer current.
      not_ready:
        value:
          error:
            code: VIDEO_NOT_READY
            message: The video is not ready.
