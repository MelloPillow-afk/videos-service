x-python-module: thumbnails
x-python-name: ThumbnailUploadCreate
type: object
required:
  - file_name
  - content_type
  - size_bytes
description: JPEG, PNG, or WebP up to 5 MiB, exactly 1280 by 720 pixels.
properties:
  file_name:
    type: string
    minLength: 1
    description: Name of the image file.
  content_type:
    type: string
    minLength: 1
    description: Image media type, such as image/jpeg.
    examples:
      - image/jpeg
  size_bytes:
    type: integer
    format: int64
    minimum: 1
    description: File size in bytes.
examples:
  - file_name: faith-cover.jpg
    content_type: image/jpeg
    size_bytes: 183420
