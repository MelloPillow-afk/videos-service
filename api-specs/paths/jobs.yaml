/jobs/{job_id}:
  parameters:
    - $ref: ../parameters/job_id.yaml
  get:
    tags:
      - Jobs
    operationId: jobs.get_job
    summary: Get Job
    description: Get the status of a background processing job.
    x-required-role: admin
    responses:
      '200':
        description: Job details.
        content:
          application/json:
            schema:
              $ref: ../schemas/jobs/job.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '404':
        $ref: ../responses/job_not_found.yaml
      '422':
        $ref: ../responses/validation_error.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml
