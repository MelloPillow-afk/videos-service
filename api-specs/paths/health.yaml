/ping:
  servers:
    - url: /
  get:
    tags:
      - Health
    operationId: health.get_resource
    summary: Get Health
    description: Check API reachability. Does not check the database.
    security: []
    responses:
      '200':
        description: The API is responding.
        content:
          application/json:
            schema:
              $ref: ../schemas/health/ping.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '500':
        $ref: ../responses/internal_error.yaml
