/videos:
  post:
    tags:
      - Videos
    operationId: videos.create_video
    summary: Create Video
    description: Create a draft with a title and optional description.
    x-required-role: admin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/videos/video_create.yaml
    responses:
      '201':
        description: Video draft created.
        headers:
          Location:
            $ref: ../parameters/response_location.yaml
        content:
          application/json:
            schema:
              $ref: ../schemas/videos/video.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '422':
        $ref: ../responses/validation_error.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml
  get:
    tags:
      - Videos
    operationId: videos.list_videos
    summary: Get Videos Collection
    description: |
      Anonymous viewers see only READY and PUBLISHED videos. Lifecycle and
      publication filters require administrator access. Search matches title
      substrings case-insensitively. Pages use descending creation time and ID;
      continuation cursors are bound to the original search, filters, page size,
      and visibility. Invalid or mismatched cursors return 400.
    security:
      - bearer_auth: []
      - {}
    parameters:
      - $ref: ../parameters/limit.yaml
      - $ref: ../parameters/cursor.yaml
      - $ref: ../parameters/status.yaml
      - $ref: ../parameters/publication_status.yaml
      - $ref: ../parameters/search.yaml
    responses:
      '200':
        description: A page of videos.
        content:
          application/json:
            schema:
              $ref: ../schemas/videos/videos.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '422':
        $ref: ../responses/validation_error.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml

/videos/{id}:
  parameters:
    - $ref: ../parameters/id.yaml
  get:
    tags:
      - Videos
    operationId: videos.get_video
    summary: Get Video
    description: |
      Administrators see full lifecycle details. Anonymous viewers see only
      READY and PUBLISHED videos; hidden and nonexistent videos return 404.
    security:
      - bearer_auth: []
      - {}
    responses:
      '200':
        $ref: ../responses/video_resource.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '404':
        $ref: ../responses/video_not_found.yaml
      '422':
        $ref: ../responses/validation_error.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml
  patch:
    tags:
      - Videos
    operationId: videos.update_video
    summary: Update Video
    description: |
      Edit metadata independently of processing. Only READY videos can publish;
      thumbnail readiness does not gate publication. Repeated publication keeps
      published_at; unpublishing clears it. DELETING videos reject mutations.
    x-required-role: admin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/videos/video_update.yaml
    responses:
      '200':
        $ref: ../responses/video_resource.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '404':
        $ref: ../responses/video_not_found.yaml
      '409':
        $ref: ../responses/conflict.yaml
      '422':
        $ref: ../responses/validation_error.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml
  delete:
    tags:
      - Videos
    operationId: videos.delete_video
    summary: Delete Video
    description: |
      Atomically enter DELETING and record cleanup work before direct launch.
      Discovery and mutations are blocked immediately. Repeated deletion while
      in progress returns 202 without creating another cleanup job; missing or
      fully removed videos return 404. Acceptance does not mean physical media
      cleanup is complete. Cleanup replaces media bytes with permanent zero-byte
      guard objects before removing application records; retained markers prevent
      late conditional uploads or worker writes from recreating media. Cleanup
      failures remain DELETING and permit explicit operator recovery.
    x-required-role: admin
    responses:
      '202':
        description: Video deletion requested or already in progress.
        content:
          application/json:
            schema:
              $ref: ../schemas/videos/video_deletion.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '404':
        $ref: ../responses/video_not_found.yaml
      '409':
        $ref: ../responses/conflict.yaml
      '422':
        $ref: ../responses/validation_error.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml

/videos/{id}:upload-url:
  parameters:
    - $ref: ../parameters/id.yaml
  post:
    tags:
      - Uploads
    operationId: videos.upload_url
    summary: Create Video Upload URL
    description: |
      Authorize a new isolated MP4 upload for CREATED or UPLOADING videos, with
      a fifteen-minute URL. Declared size above the configured 100 MiB default
      returns 413. Older upload attempts cannot replace the active source.
    x-required-role: admin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/uploads/source_upload_create.yaml
    responses:
      '200':
        description: Upload URL and instructions.
        content:
          application/json:
            schema:
              $ref: ../schemas/uploads/source_upload.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '404':
        $ref: ../responses/video_not_found.yaml
      '409':
        $ref: ../responses/conflict.yaml
      '413':
        $ref: ../responses/file_too_large.yaml
      '422':
        $ref: ../responses/validation_error.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml

/videos/{id}:complete-upload:
  parameters:
    - $ref: ../parameters/id.yaml
  post:
    tags:
      - Uploads
    operationId: videos.complete_upload
    summary: Confirm Video Upload
    description: |
      Verify the current object and actual size, then record independent video
      and thumbnail jobs before launching them directly. Rejection preserves
      UPLOADING. Repeating accepted completion returns the existing job.
      Confirmed objects are protected against later upload writes.
    x-required-role: admin
    requestBody:
      $ref: ../index.yaml#/components/requestBodies/upload_completion
    responses:
      '202':
        description: Upload accepted for processing.
        content:
          application/json:
            schema:
              $ref: ../schemas/uploads/source_upload_processing.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '404':
        description: The video or uploaded file was not found.
        content:
          application/json:
            schema:
              $ref: ../index.yaml#/components/schemas/error
      '409':
        $ref: ../responses/conflict.yaml
      '413':
        $ref: ../responses/file_too_large.yaml
      '422':
        $ref: ../responses/validation_error.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml

/videos/{id}/playback:
  parameters:
    - $ref: ../parameters/id.yaml
  get:
    tags:
      - Playback
    operationId: playback.get_playback
    summary: Get Video Playback
    description: |
      Return the configured public delivery URL for a READY video's stored HLS
      master key. Administrators can preview drafts; anonymous viewers require
      PUBLISHED. Hidden and nonexistent videos return 404. An administrator
      requesting playback before readiness receives 409. Publication controls
      API discovery; previously obtained CDN links may outlive unpublication.
    security:
      - bearer_auth: []
      - {}
    responses:
      '200':
        description: Video playback link.
        content:
          application/json:
            schema:
              $ref: ../schemas/playback/playback.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '404':
        $ref: ../responses/video_not_found.yaml
      '409':
        $ref: ../responses/conflict.yaml
      '422':
        $ref: ../responses/validation_error.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml

/videos/{id}:retry:
  parameters:
    - $ref: ../parameters/id.yaml
  post:
    tags:
      - Videos
    operationId: videos.retry_processing
    summary: Retry Video Processing
    description: |
      Retry only FAILED video processing with a retained validated source. Record
      a new processing job and output namespace, return QUEUED, and launch it
      directly. Publication remains DRAFT; thumbnail recovery is independent.
      Concurrent retries cannot create multiple current processing jobs. Invalid
      sources require deletion and recreation. Temporary failures permit three
      total worker executions per job with increasing delays; interrupted job
      launch or execution may require explicit manual recovery.
    x-required-role: admin
    responses:
      '202':
        description: Video processing retry requested.
        content:
          application/json:
            schema:
              $ref: ../schemas/videos/video_retry.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '404':
        $ref: ../responses/video_not_found.yaml
      '409':
        $ref: ../responses/conflict.yaml
      '422':
        $ref: ../responses/validation_error.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml
