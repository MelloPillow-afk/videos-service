/videos/{id}/thumbnails:upload-url:
  parameters:
    - $ref: ../parameters/id.yaml
  post:
    tags:
      - Thumbnails
    operationId: thumbnails.upload_url
    summary: Create Video Thumbnail Upload URL
    description: |
      Upload JPEG, PNG, or WebP up to 5 MiB, with exact 1280 by 720 dimensions.
      The client crops the image. URLs expire after fifteen minutes. Each
      authorization supersedes prior thumbnail attempts, uses an isolated key,
      and requires a signed create-once PUT. DELETING videos reject mutations.
    x-required-role: admin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/thumbnails/thumbnail_upload_create.yaml
    responses:
      '200':
        description: Thumbnail upload URL and instructions.
        content:
          application/json:
            schema:
              $ref: ../schemas/thumbnails/thumbnail_upload.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '404':
        $ref: ../responses/video_not_found.yaml
      '409':
        $ref: ../responses/conflict.yaml
      '413':
        $ref: ../responses/file_too_large.yaml
      '422':
        $ref: ../responses/validation_error.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml

/videos/{id}/thumbnails:complete-upload:
  parameters:
    - $ref: ../parameters/id.yaml
  post:
    tags:
      - Thumbnails
    operationId: thumbnails.complete_upload
    summary: Confirm Video Thumbnail Upload
    description: |
      Decode the current uploaded image and verify actual format, declared type,
      byte count, and exact dimensions before activating the custom thumbnail.
      Rejections preserve the active image. Repeated accepted completion is
      idempotent; superseded or removed attempts cannot reactivate images.
    x-required-role: admin
    requestBody:
      $ref: ../index.yaml#/components/requestBodies/upload_completion
    responses:
      '200':
        description: The current thumbnail.
        content:
          application/json:
            schema:
              $ref: ../schemas/thumbnails/thumbnail.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '404':
        description: The video or uploaded thumbnail was not found.
        content:
          application/json:
            schema:
              $ref: ../index.yaml#/components/schemas/error
      '409':
        $ref: ../responses/conflict.yaml
      '413':
        $ref: ../responses/file_too_large.yaml
      '422':
        $ref: ../responses/validation_error.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml

/videos/{id}/thumbnails:
  parameters:
    - $ref: ../parameters/id.yaml
  delete:
    tags:
      - Thumbnails
    operationId: thumbnails.delete_thumbnail
    summary: Delete Video Thumbnail
    description: |
      Idempotently remove the custom selection and invalidate pending thumbnail
      attempts. A ready generated image becomes active; otherwise return
      PENDING/NONE/null or FAILED/NONE/null for the generated state. DELETING
      videos reject mutations. Generated image bytes are retained.
    x-required-role: admin
    responses:
      '200':
        description: The generated thumbnail or its current status.
        content:
          application/json:
            schema:
              $ref: ../schemas/thumbnails/thumbnail.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '404':
        $ref: ../responses/video_not_found.yaml
      '409':
        $ref: ../responses/conflict.yaml
      '422':
        $ref: ../responses/validation_error.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml
