/videos/{id}/thumbnail/upload-url:
  parameters:
    - $ref: ../parameters/id.yaml
  post:
    tags:
      - Thumbnails
    operationId: create_thumbnail_upload_url
    summary: Create Video Thumbnail Upload URL
    description: Get a URL and instructions to upload a custom thumbnail.
    x-required-role: admin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/thumbnails/thumbnail_upload_create.yaml
    responses:
      '200':
        description: Thumbnail upload URL and instructions.
        content:
          application/json:
            schema:
              $ref: ../schemas/thumbnails/thumbnail_upload.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '404':
        $ref: ../responses/video_not_found.yaml
      '409':
        $ref: ../responses/conflict.yaml
      '413':
        $ref: ../responses/file_too_large.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml

/videos/{id}/thumbnail/complete-upload:
  parameters:
    - $ref: ../parameters/id.yaml
  post:
    tags:
      - Thumbnails
    operationId: complete_thumbnail_upload
    summary: Confirm Video Thumbnail Upload
    description: Confirm an upload and use it as the custom thumbnail.
    x-required-role: admin
    requestBody:
      $ref: ../index.yaml#/components/requestBodies/upload_completion
    responses:
      '200':
        description: The current thumbnail.
        content:
          application/json:
            schema:
              $ref: ../schemas/thumbnails/thumbnail.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '404':
        description: The video or uploaded thumbnail was not found.
        content:
          application/json:
            schema:
              $ref: ../index.yaml#/components/schemas/error
      '409':
        $ref: ../responses/conflict.yaml
      '413':
        $ref: ../responses/file_too_large.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml

/videos/{id}/thumbnail:
  parameters:
    - $ref: ../parameters/id.yaml
  delete:
    tags:
      - Thumbnails
    operationId: remove_custom_thumbnail
    summary: Delete Video Thumbnail
    description: Remove the custom thumbnail and use the generated image.
    x-required-role: admin
    responses:
      '200':
        description: The generated thumbnail or its current status.
        content:
          application/json:
            schema:
              $ref: ../schemas/thumbnails/thumbnail.yaml
      '400':
        $ref: ../responses/bad_request.yaml
      '401':
        $ref: ../responses/unauthorized.yaml
      '403':
        $ref: ../responses/forbidden.yaml
      '404':
        $ref: ../responses/video_not_found.yaml
      '409':
        $ref: ../responses/conflict.yaml
      '429':
        $ref: ../responses/too_many_requests.yaml
      '500':
        $ref: ../responses/internal_error.yaml
      '503':
        $ref: ../responses/unavailable.yaml
