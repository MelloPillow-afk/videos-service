name: CI

# Pull requests run the checks and build both images. Pushes to main also deploy:
# images → migrations (only when new, after approval) → worker job → API.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer pull request push supersedes the old run; a main deploy always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: videos-service
  REGION: us-central1
  IMAGES: us-central1-docker.pkg.dev/videos-service/videos
  WIF_PROVIDER: projects/749098550492/locations/global/workloadIdentityPools/github/providers/videos-service
  DEPLOYER: github-deployer@videos-service.iam.gserviceaccount.com
  RUNTIME_SECRETS: DATABASE_URL=videos-database-url:latest,R2_ACCESS_KEY_ID=videos-r2-access-key-id:latest,R2_SECRET_ACCESS_KEY=videos-r2-secret-access-key:latest
  DEPLOYING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  quality:
    name: Lint, format, and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.4"
          enable-cache: true
      - run: uv sync --locked
      - run: make check

  tests:
    name: HTTP, database, migrations, and media
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://videos:videos@localhost:5432/videos_test
      TEST_DATABASE_URL: postgresql://videos:videos@localhost:5432/videos_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: videos
          POSTGRES_PASSWORD: videos
          POSTGRES_DB: videos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U videos -d videos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.4"
          enable-cache: true
      # Worker tests run real FFmpeg.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: uv sync --locked
      - run: make migrate
      - run: make coverage

  images:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - if: env.DEPLOYING == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - if: env.DEPLOYING == 'true'
        uses: google-github-actions/setup-gcloud@v3
      - if: env.DEPLOYING == 'true'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: ${{ env.DEPLOYING == 'true' }}
          tags: ${{ env.IMAGES }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          platforms: linux/amd64
          push: ${{ env.DEPLOYING == 'true' }}
          tags: ${{ env.IMAGES }}/worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  plan:
    name: Find new migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
      # Compare against the commit the API runs, not the previous push, so a failed
      # deploy's migrations are still found by the next one.
      - id: diff
        run: |
          deployed=$(gcloud run services describe videos-api --project "$PROJECT" --region "$REGION" \
            --format='value(metadata.labels.commit-sha)')
          if [ -n "$deployed" ] && git cat-file -e "$deployed^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$deployed" "$GITHUB_SHA" -- migrations/)
          else
            changed="unknown deployed commit '$deployed'"
          fi
          if [ -n "$changed" ]; then
            printf 'Migrations to apply since %s:\n%s\n' "${deployed:-nothing}" "$changed" >> "$GITHUB_STEP_SUMMARY"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new migrations since $deployed." >> "$GITHUB_STEP_SUMMARY"
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    name: Apply migrations
    needs: [quality, tests, images, plan]
    if: needs.plan.outputs.migrations == 'true'
    # Required reviewers on this environment make schema changes wait for approval.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: |
          gcloud run jobs deploy videos-migrate --project "$PROJECT" --region "$REGION" \
            --image="$IMAGES/api:$GITHUB_SHA" \
            --service-account="videos-migrate@$PROJECT.iam.gserviceaccount.com" \
            --command=python --args=-m,src.repositories.migrate,apply \
            --tasks=1 --max-retries=0 --task-timeout=10m \
            --env-vars-file=deploy/env.yaml \
            --set-secrets=DATABASE_URL=videos-migrate-database-url:latest \
            --labels="commit-sha=$GITHUB_SHA" \
            --execute-now --wait

  deploy:
    name: Deploy
    needs: [quality, tests, images, plan, migrate]
    # Runs after migrations succeed, or when there were none to run.
    if: >-
      !cancelled()
      && needs.quality.result == 'success' && needs.tests.result == 'success'
      && needs.images.result == 'success' && needs.plan.result == 'success'
      && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy worker job
        run: |
          gcloud run jobs deploy videos-worker --project "$PROJECT" --region "$REGION" \
            --image="$IMAGES/worker:$GITHUB_SHA" \
            --service-account="videos-worker@$PROJECT.iam.gserviceaccount.com" \
            --tasks=1 --max-retries=0 --task-timeout=30m --cpu=2 --memory=4Gi \
            --env-vars-file=deploy/env.yaml --set-secrets="$RUNTIME_SECRETS" \
            --labels="commit-sha=$GITHUB_SHA"
      # Keeps the service's public access as is; changing it needs more than run.developer.
      - name: Deploy API
        run: |
          gcloud run deploy videos-api --project "$PROJECT" --region "$REGION" \
            --image="$IMAGES/api:$GITHUB_SHA" \
            --service-account="videos-api@$PROJECT.iam.gserviceaccount.com" \
            --max-instances=10 \
            --env-vars-file=deploy/env.yaml --set-secrets="$RUNTIME_SECRETS" \
            --labels="commit-sha=$GITHUB_SHA"
      - name: Check the API
        run: |
          url=$(gcloud run services describe videos-api --project "$PROJECT" --region "$REGION" \
            --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$url/ping"
          echo "Deployed $GITHUB_SHA to $url" >> "$GITHUB_STEP_SUMMARY"
