# Production settings for videos-api, videos-worker, and videos-migrate. Only plain,
# non-secret values belong here; anything else uses the defaults in src/config.py.
# Secrets (database URLs, R2 keys) come from Secret Manager, and settings that name our
# Neon and Cloudflare accounts from GitHub variables (deploy/render-env.sh): see
# docs/deployment.md.
API_ENV: prod
GCP_PROJECT: videos-service
GCP_REGION: us-central1
WORKER_JOB_NAME: videos-worker
# Direct Neon connections: keep instances × pool size under Neon's limit (ADR 0001).
DB_POOL_MIN_SIZE: "0"
DB_POOL_MAX_SIZE: "2"
