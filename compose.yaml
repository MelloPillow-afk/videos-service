services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: videos
      POSTGRES_PASSWORD: videos
      POSTGRES_DB: videos_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videos -d videos_dev"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-test:
    image: postgres:17
    profiles: [test]
    environment:
      POSTGRES_USER: videos
      POSTGRES_PASSWORD: videos
      POSTGRES_DB: videos_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videos -d videos_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
